version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    groups:
      npm-patch:
        update-types: [patch]
      npm-minor:
        update-types: [minor]
    ignore:
      # Exact prerelease pin; the daily duckdb-canary workflow tracks new builds.
      - dependency-name: "@duckdb/duckdb-wasm"
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    groups:
      uv-patch:
        update-types: [patch]
      uv-minor:
        update-types: [minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-patch:
        update-types: [patch]
      actions-minor:
        update-types: [minor]
