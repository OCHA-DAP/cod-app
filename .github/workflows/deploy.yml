name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [py-docs-updated]
  schedule:
    - cron: "0 6 * * *" # daily status data refresh
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: deploy-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Fork PRs get no secrets, so they can't fetch status data or deploy.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: OCHA-DAP/topo-tools
          path: topo-tools
          fetch-depth: 0
          sparse-checkout: |
            docs/pages
            plugins
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: npm run fetch:status
        env:
          ARCGIS_USERNAME: ${{ secrets.ARCGIS_USERNAME }}
          ARCGIS_PASSWORD: ${{ secrets.ARCGIS_PASSWORD }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      - run: npm run build
        env:
          PY_DOCS_DIR: topo-tools/docs/pages
          PUBLIC_DECISIONS_SHEET_URL: ${{ vars.PUBLIC_DECISIONS_SHEET_URL }}
      - name: Build git-free plugin archive
        working-directory: topo-tools
        run: |
          set -euo pipefail
          mtime="$(git log -1 --format=%ct HEAD -- plugins/topo-tools)"
          git archive --format=zip \
            --mtime="@${mtime} +0000" \
            --prefix=topo-tools/ \
            -o ../dist/tools/topo-tools-plugin.zip \
            HEAD:plugins/topo-tools
      - name: Generate marketplace manifest
        working-directory: topo-tools
        run: |
          set -euo pipefail
          sha256="$(sha256sum ../dist/tools/topo-tools-plugin.zip | cut -d' ' -f1)"
          plugin_name="$(jq -r '.name' plugins/topo-tools/.claude-plugin/plugin.json)"
          plugin_description="$(jq -r '.description' plugins/topo-tools/.claude-plugin/plugin.json)"
          jq -n \
            --arg name "$plugin_name" \
            --arg description "$plugin_description" \
            --arg sha256 "$sha256" \
            '{
              name: "topo-tools",
              owner: { name: "OCHA-DAP" },
              plugins: [
                {
                  name: $name,
                  description: $description,
                  source: {
                    source: "archive",
                    url: "https://cod.unocha.org/tools/topo-tools-plugin.zip",
                    sha256: $sha256
                  }
                }
              ]
            }' > ../dist/tools/marketplace.json
          jq empty ../dist/tools/marketplace.json
      - name: Check for broken links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --offline --no-progress --root-dir ${{ github.workspace }}/dist
            'dist/**/*.html'
          lycheeVersion: v0.24.2
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true

  close-preview:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
          app_location: dist
