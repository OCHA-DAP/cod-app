title: Netherlands admin2 (gemeenten) 2023
description: 342 gemeenten from the CBS Wijk- en Buurtkaart 2023. 81 of them also have a water row sharing the gemeente code, and one `B` row (`GM0998` Buitenland) covers Belgian territory around Baarle-Nassau. Agents should start at [AGENTS.md](AGENTS.md).
