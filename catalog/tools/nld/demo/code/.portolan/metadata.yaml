title: Gemeenten 2022 and 2023 for code-update
description: 'An old and a new layer for code-update, in OGC:CRS84, simplified to 100 m. `nld_admin2_2022.parquet` has the 345 land gemeenten from the CBS Wijk- en Buurtkaart 2022, coded by code-create from root `NL`. `nld_admin2_2023.parquet` has the 342 land gemeenten of 2023 with only their CBS and Kadaster codes. Running code-update carries the 2022 codes forward: two mergers retire 5 codes and create 2, and the other 340 gemeenten keep theirs. See [AGENTS.md](AGENTS.md).'
keywords:
- administrative boundaries
- Netherlands
- CBS
- Kadaster
- gemeenten
- topo-tools
- code-update
processing_notes: Built by `scripts/catalog/tools/build_demo.py` in [cod-site](https://github.com/OCHA-DAP/cod-site) from the land rows of `nld/2022/nld_admin2` and `nld/2023/nld_admin2`, each simplified like `schema-join`, with adm1 added by schema-join against the `schema-join` provincies and adm0 set to `NL`. The 2022 layer is then coded by `code-create` with root `NL`, no delimiter and 2-digit parts, keeping the source codes as `adm1_code1` and `adm2_code1`.
