title: Gemeenten 2025 for package
description: The 342 gemeenten from the `edge` demo after edge-match, filling their provincies including water, in OGC:CRS84. Each carries adm0 `NL`, its provincie as adm1 from Kadaster and its CBS code and name as adm2. Running package writes country, provincie and gemeente polygons, one point per unit and the boundary lines. See [AGENTS.md](AGENTS.md).
keywords:
- administrative boundaries
- Netherlands
- CBS
- Kadaster
- gemeenten
- provincies
- topo-tools
- package
processing_notes: 'Built by `scripts/catalog/tools/build_demo.py` in [cod-site](https://github.com/OCHA-DAP/cod-site): `edge-match --per-feature` on the `edge` demo, then schema-join against the `schema-join` provincies for adm1, and adm0 set to `NL`.'
providers:
