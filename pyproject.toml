[project]
name = "cod-site"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "httpx2>=2.16.0",
    "portolan-cli>=0.9.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0",
    "tenacity>=9.2.1",
    "topo-tools>=0.19.1",
    "tylertoo>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts/shared"]

[tool.uv]
# geoparquet-io 1.7 (via portolan-cli) pins duckdb<1.6; the scripts need DuckDB 2.0.
override-dependencies = ["duckdb>=2.0.0"]
